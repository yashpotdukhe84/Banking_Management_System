<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Banking Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px 16px;
        }
        .card {
            max-width: 440px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 6px;
            padding: 24px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            text-align: center;
            color: #222222;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #333333;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #198754;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background-color: #157347;
        }
        .field-error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
        }
        .hint {
            color: #666666;
            font-size: 12px;
            margin-top: 3px;
        }
        .footer-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
        .footer-link a {
            color: #0d6efd;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Customer Registration</h2>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" th:field="*{fullName}" placeholder="Enter full name" required />
            <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Enter email" required />
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Enter password" required />
            <div class="hint">8-64 chars, uppercase, lowercase, number, and special character</div>
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" th:field="*{phone}" placeholder="10-digit mobile number" required />
            <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" th:field="*{address}" placeholder="Enter address" required />
            <div class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>

        <div class="form-group">
            <label for="panNumber">PAN Number (Optional)</label>
            <input type="text" id="panNumber" th:field="*{panNumber}" placeholder="ABCDE1234F" />
            <div class="field-error" th:if="${#fields.hasErrors('panNumber')}" th:errors="*{panNumber}"></div>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="footer-link">
        Already have an account? <a th:href="@{/login}">Login here</a>
    </div>
</div>

<th:block th:replace="~{toast :: toast}"></th:block>
</body>
</html>
