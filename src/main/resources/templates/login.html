<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Banking Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 16px;
        }
        .card {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 6px;
            padding: 24px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            text-align: center;
            color: #222222;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #333333;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0b5ed7;
        }
        .field-error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
        }
        .footer-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
        .footer-link a {
            color: #0d6efd;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Bank Login</h2>

    <form th:action="@{/login}" th:object="${loginRequest}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Enter email" required />
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Enter password" required />
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="footer-link">
        New customer? <a th:href="@{/register}">Register here</a>
    </div>
</div>

<th:block th:replace="~{toast :: toast}"></th:block>
</body>
</html>
